name: Publish mockup to GitHub Pages

# Keeps the gh-pages branch (which GitHub Pages serves) in sync with
# docs/mockup/wow_lab_os_mockup.html on main. gh-pages is deliberately an
# isolated orphan branch containing only the mockup as index.html -- it
# never receives anything else from docs/ (progress.md, phase1 plan, etc.
# are internal and must never be published).

on:
  push:
    branches: [main]
    paths:
      - "docs/mockup/wow_lab_os_mockup.html"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          path: main

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Sync mockup to gh-pages
        run: |
          cp main/docs/mockup/wow_lab_os_mockup.html gh-pages/index.html
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Mockup unchanged, nothing to publish."
          else
            git commit -m "chore: sync mockup from main@${GITHUB_SHA}"
            git push
          fi
