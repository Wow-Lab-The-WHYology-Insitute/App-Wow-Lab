name: Sync mockup to public/ for Vercel

# Keeps public/mockup.html (served automatically by Next.js/Vercel as a
# static file -- no routing code needed) in sync with
# docs/mockup/wow_lab_os_mockup.html on main. Pushing the synced file
# triggers a normal Vercel deploy. Replaces the earlier gh-pages
# approach: GitHub Pages doesn't support private repos on GitHub's
# Free plan, and this repo now needs to be private (docs/progress.md
# #38), so the mockup rides the app's already-working Vercel
# deployment instead.

on:
  push:
    branches: [main]
    paths:
      - "docs/mockup/wow_lab_os_mockup.html"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Sync mockup to public/
        run: |
          cp docs/mockup/wow_lab_os_mockup.html public/mockup.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/mockup.html
          if git diff --cached --quiet; then
            echo "Mockup unchanged, nothing to publish."
          else
            git commit -m "chore: sync mockup to public/ from main@${GITHUB_SHA}"
            git push
          fi
