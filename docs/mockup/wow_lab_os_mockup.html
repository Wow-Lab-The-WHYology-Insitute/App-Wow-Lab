<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WOW LAB OS — Mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Tilt+Neon&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#EC008C;--pink-soft:#FCE0EF;
  --orange:#FAA21B;--orange-soft:#FDECCB;
  --amber:#FAA21B;--amber-soft:#FDECCB;
  --purple:#B01E77;--purple-soft:#F6D6E7;
  --teal:#2F9E78;--teal-soft:#DCF0E6;
  --slate:#2A2230;--slate-mid:#4A4152;--slate-light:#948C9C;
  --border:#ECE6E9;--bg-page:#F6F2F4;--bg-card:#FFFFFF;--bg-sidebar:#241B26;
  --text:#241A22;--text-mid:#4A4048;--text-muted:#8B8088;
  --r:12px;--r-sm:8px;--shadow:0 2px 12px rgba(0,0,0,.06);--shadow-md:0 4px 24px rgba(0,0,0,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cabin',sans-serif;background:var(--bg-page);color:var(--text);min-height:100vh;display:flex}

.sidebar{width:236px;flex-shrink:0;background:var(--bg-sidebar);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar-logo{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.logo-mark{font-family:'Tilt Neon',cursive;font-size:22px;color:#fff;letter-spacing:.3px}
.logo-sub{font-size:9px;color:rgba(255,255,255,.4);letter-spacing:.14em;text-transform:uppercase;margin-top:2px}
.org-chip{margin-top:10px;display:flex;align-items:center;gap:6px;font-size:10px;color:rgba(255,255,255,.55);background:rgba(255,255,255,.06);padding:5px 8px;border-radius:6px}
.nav-section{padding:10px 10px 2px}
.nav-label{font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.3);padding:0 8px;margin-bottom:4px}
.nav-item{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:var(--r-sm);font-size:12.5px;font-weight:500;color:rgba(255,255,255,.55);cursor:pointer;transition:all .15s;margin-bottom:1px;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.85)}
.nav-item.active{background:var(--pink);color:#fff}
.nav-icon{font-size:14px;width:18px;text-align:center;flex-shrink:0}
.nav-badge{margin-left:auto;font-size:9px;font-weight:700;background:rgba(255,255,255,.14);color:#fff;padding:1px 6px;border-radius:10px}
.nav-lock{margin-left:auto;font-size:10px;opacity:.5}
.sidebar-foot{padding:12px 16px;margin-top:auto;border-top:1px solid rgba(255,255,255,.08);font-size:10px;color:rgba(255,255,255,.35);line-height:1.5}

.main{flex:1;overflow:auto;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 32px;background:var(--bg-card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.topbar-left{font-size:12px;color:var(--text-muted)}
.topbar-right{display:flex;align-items:center;gap:18px}
.role-switch{display:flex;align-items:center;gap:10px}
.role-switch label{font-size:11px;color:var(--text-muted);white-space:nowrap}
.role-switch select{font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text);padding:8px 12px;border:1.5px solid var(--border);border-radius:var(--r-sm);background:var(--bg-card);cursor:pointer;min-width:230px}
.role-switch select:hover{border-color:var(--pink)}
.lang-switch{display:flex;border:1.5px solid var(--border);border-radius:20px;overflow:hidden}
.lang-btn{font-family:inherit;font-size:11px;font-weight:700;padding:6px 12px;border:none;background:var(--bg-card);color:var(--text-muted);cursor:pointer}
.lang-btn.active{background:var(--pink);color:#fff}

.page-hero{padding:26px 32px 22px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.page-eyebrow{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px}
.page-title{font-family:'Tilt Neon',cursive;font-size:27px;font-weight:400;letter-spacing:.2px;line-height:1.15}
.page-sub{font-size:13.5px;color:var(--text-mid);margin-top:4px;line-height:1.5;max-width:600px}
.page-actions{display:flex;gap:8px;align-items:center;flex-shrink:0}
.page-body{padding:24px 32px 60px}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--r-sm);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;border:none;font-family:inherit;text-decoration:none}
.btn-primary{background:var(--pink);color:#fff}.btn-primary:hover{background:#C2007A}
.btn-secondary{background:var(--bg-card);border:1.5px solid var(--border);color:var(--text-mid)}.btn-secondary:hover{border-color:var(--pink);color:var(--pink)}
.btn-sm{padding:5px 12px;font-size:12px}

.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);padding:15px}
.stat-num{font-family:'Cabin',sans-serif;font-size:29px;font-weight:700;line-height:1;letter-spacing:-.5px}
.stat-label{font-size:11px;color:var(--text-muted);margin-top:4px;line-height:1.4}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted);margin-bottom:12px}
.tint{border-radius:var(--r);padding:16px 18px;margin-bottom:16px}
.tint-pink{background:linear-gradient(135deg,#FFF0F8,#FFF6EE);border:1px solid #FAD3E7}
.tint-teal{background:linear-gradient(135deg,#EFF9F3,#F4FBF7);border:1px solid #CDE9DA}
.tint-purple{background:linear-gradient(135deg,#FBEFF6,#FDF3F8);border:1px solid #F2D3E5}
.tint-amber{background:linear-gradient(135deg,#FFF7EA,#FFFBF2);border:1px solid #FBE3B8}
.tint-slate{background:linear-gradient(135deg,#F4F1F3,#F0ECEF);border:1px solid #E4DDE2}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.03em}
.b-pink{background:var(--pink-soft);color:#B0006A}.b-teal{background:var(--teal-soft);color:#1E7355}
.b-purple{background:var(--purple-soft);color:#8A1560}.b-amber{background:var(--amber-soft);color:#9A6208}
.b-slate{background:#EFEAED;color:#5A4F58}.b-orange{background:var(--orange-soft);color:#9A6208}

.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th{padding:9px 12px;text-align:left;font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border);background:#FAFAF8}
.data-table td{padding:10px 12px;border-bottom:1px solid rgba(0,0,0,.04);color:var(--text-mid);vertical-align:middle}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:#FDFCFB}
.tbl-action{font-size:11px;padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg-card);color:var(--text-muted);cursor:pointer;font-family:inherit;margin-right:4px}
.tbl-action:hover{border-color:var(--pink);color:var(--pink)}
.masked{font-family:monospace;color:var(--text-muted);letter-spacing:1px}

.banner{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:var(--r-sm);font-size:12.5px;margin-bottom:14px;line-height:1.5}
.banner-amber{background:var(--amber-soft);border:1px solid #F5D898;color:#7A5210}
.banner-teal{background:var(--teal-soft);border:1px solid #9FE1CB;color:#0A5647}
.banner-purple{background:var(--purple-soft);border:1px solid #CFC7F5;color:#3E33A0}
.banner-slate{background:#EAEDF4;border:1px solid #D2D8E6;color:#3A4360}

.tabs{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap}
.tab{font-size:12px;padding:7px 14px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--bg-card);color:var(--text-muted);cursor:pointer;font-family:inherit;font-weight:600}
.tab.active{background:var(--slate);border-color:var(--slate);color:#fff}

.alert-row{display:flex;align-items:flex-start;gap:12px;padding:13px 15px;background:var(--bg-card);border:1px solid var(--border);border-left:3px solid var(--slate-light);border-radius:var(--r-sm);margin-bottom:8px}
.alert-row.high{border-left-color:var(--pink)}
.alert-row.med{border-left-color:var(--amber)}
.alert-row.low{border-left-color:var(--teal)}
.alert-ic{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.alert-body{flex:1}
.alert-t{font-size:13px;font-weight:600}
.alert-s{font-size:11.5px;color:var(--text-muted);margin-top:2px;line-height:1.45}

.field{margin-bottom:12px}
.field label{display:block;font-size:11px;font-weight:600;color:var(--text-mid);margin-bottom:5px}
.field input,.field select{width:100%;font-family:inherit;font-size:13px;padding:9px 11px;border:1.5px solid var(--border);border-radius:var(--r-sm);background:#fff;color:var(--text)}
.field input:focus,.field select:focus{outline:none;border-color:var(--pink)}
.chk{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-mid);cursor:pointer;padding:6px 0}

.code-out{font-family:'Tilt Neon',cursive;font-size:32px;font-weight:400;color:var(--pink);letter-spacing:1px;word-break:break-all}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(0,0,0,.05);font-size:13px}
.kv:last-child{border-bottom:none}
.kv b{font-family:'Cabin',sans-serif;font-weight:700;font-size:14px}

.quiz-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:10px}
.quiz-q{font-size:13.5px;font-weight:600;margin-bottom:10px}
.quiz-opt{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:var(--r-sm);border:1.5px solid var(--border);cursor:pointer;font-size:12.5px;margin-bottom:6px;transition:all .12s}
.quiz-opt:hover{border-color:var(--pink);background:var(--pink-soft)}
.quiz-opt.selected{border-color:var(--pink);background:var(--pink-soft)}
.quiz-opt.correct{border-color:var(--teal);background:var(--teal-soft)}
.quiz-opt.wrong{border-color:var(--pink);background:#FBE3EA}

.pcard{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden;transition:all .2s}
.pcard:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.pthumb{aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;font-size:30px}
.pinfo{padding:9px 11px}
.pname{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta{font-size:10px;color:var(--text-muted);margin-top:2px}

.bars{display:flex;align-items:flex-end;gap:14px;height:150px;padding-top:10px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.bar{width:100%;max-width:46px;border-radius:6px 6px 0 0;background:var(--pink)}
.bar-lbl{font-size:10px;color:var(--text-muted)}
.legend{display:flex;gap:16px;font-size:11px;color:var(--text-muted);margin-top:10px}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}

.person-pill{display:inline-flex;align-items:center;gap:7px;font-size:11px;color:var(--text-mid);background:#fff;border:1px solid var(--border);padding:5px 10px;border-radius:20px}
.deferred{opacity:.55}
</style>
</head>
<body>

<nav class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-mark">🧪 <span style="background:linear-gradient(90deg,#EC008C,#FAA21B);-webkit-background-clip:text;background-clip:text;color:transparent">WOW LAB OS</span></div>
    <div class="logo-sub" id="logoSub">Operations Platform</div>
    <div class="org-chip" id="orgChip">🏢 wow-lab · production</div>
  </div>
  <div id="navRoot"></div>
  <div class="sidebar-foot" id="sidebarFoot">Demo mockup · fictional data<br>RLS deny-by-default · EU/Frankfurt</div>
</nav>

<main class="main">
  <div class="topbar">
    <div class="topbar-left" id="crumb">Home / Dashboard</div>
    <div class="topbar-right">
      <div class="lang-switch">
        <button class="lang-btn" id="langEnBtn" onclick="setLocale('en')">EN</button>
        <button class="lang-btn" id="langRoBtn" onclick="setLocale('ro')">RO</button>
      </div>
      <div class="role-switch">
        <label id="roleSwitchLbl">👁 View app as:</label>
        <select id="roleSel" onchange="setRole(this.value)"></select>
      </div>
    </div>
  </div>
  <div id="screen"></div>
</main>

<script>
/* ═══════════ I18N — English default, Romanian switchable. Proper nouns (real school
   names, people's names, official Romanian program names like "Școala Altfel" /
   "Săptămâna Verde" / "Wow Lab Party") are NEVER translated — same principle as not
   translating "Oktoberfest" in an English sentence. ═══════════ */
let locale='en';
function tt(en,ro){ return locale==='en'?en:ro; }
function setLocale(l){ locale=l; document.getElementById('langEnBtn').classList.toggle('active',l==='en'); document.getElementById('langRoBtn').classList.toggle('active',l==='ro'); buildRoleSelect(); renderNav(); renderScreen(); refreshChrome(); }
function refreshChrome(){
  document.getElementById('logoSub').textContent=tt('Operations Platform','Platformă Operațională');
  document.getElementById('roleSwitchLbl').textContent=tt('👁 View app as:','👁 Vezi aplicația ca:');
  document.getElementById('sidebarFoot').innerHTML=tt('Demo mockup · fictional data<br>RLS deny-by-default · EU/Frankfurt','Machetă demonstrativă · date fictive<br>RLS deny-by-default · UE/Frankfurt');
  const chip=document.getElementById('orgChip');
  chip.textContent = role==='platform_owner' ? tt('🌐 cross-org · all organizations','🌐 cross-org · toate organizațiile') : tt('🏢 wow-lab · production','🏢 wow-lab · producție');
}

/* ═══════════ ROLES (14) — .l/.who kept in English; .lRo/.whoRo hold Romanian pair ═══════════ */
const ROLES={
  platform_owner:{l:'Platform Owner',lRo:'Platform Owner',who:'Mihai / Anca (technical)',whoRo:'Mihai / Anca (tehnic)',i:'🛡️',c:'slate'},
  master:{l:'Master / CEO',lRo:'Master / CEO',who:'Anca',whoRo:'Anca',i:'👑',c:'pink'},
  sales:{l:'Sales Manager',lRo:'Sales Manager',who:'Anca / designated',whoRo:'Anca / desemnat',i:'🎯',c:'orange'},
  contracts_admin:{l:'Contract Administrator',lRo:'Contract Administrator',who:'Laura / designated',whoRo:'Laura / desemnat',i:'📑',c:'purple'},
  ops:{l:'Operations & Curriculum',lRo:'Operations & Curriculum',who:'Cătălina',whoRo:'Cătălina',i:'🗂️',c:'teal'},
  fin_ops:{l:'Finance Operations',lRo:'Finance Operations',who:'Laura',whoRo:'Laura',i:'💸',c:'amber'},
  fin_admin:{l:'Finance Admin & Reporting',lRo:'Finance Admin & Reporting',who:'Anka',whoRo:'Anka',i:'📊',c:'amber'},
  inventory:{l:'Inventory Custodian',lRo:'Inventory Custodian',who:'Teo',whoRo:'Teo',i:'📦',c:'teal'},
  community:{l:'Community & People',lRo:'Community & People',who:'Alexandra',whoRo:'Alexandra',i:'💚',c:'pink'},
  senior_trainer:{l:'Senior Trainer',lRo:'Senior Trainer',who:'senior trainers',whoRo:'traineri seniori',i:'🧑‍🔬',c:'purple'},
  trainer:{l:'Trainer',lRo:'Trainer',who:'trainers',whoRo:'trainerii',i:'🔬',c:'pink'},
  evaluator:{l:'Evaluator',lRo:'Evaluator',who:'designated seniors',whoRo:'seniori desemnați',i:'⭐',c:'amber'},
  candidate:{l:'Candidate',lRo:'Candidate',who:'candidates (magic-link)',whoRo:'candidați (magic-link)',i:'🚪',c:'slate'},
  procurement:{l:'Procurement (deferred V1)',lRo:'Procurement (amânat V1)',who:'— not instantiated',whoRo:'— neinstanțiat',i:'🛒',c:'slate',deferred:true},
};
let role='master';
let candidateAccepted=false; /* demo: simulates candidate -> accepted transition, unlocks the Onboarding tab */

/* ═══════════ NAV ═══════════ */
const NAV=[
 {grp:'Home',grpRo:'Acasă',items:[
   {k:'dashboard',i:'🏠',l:'Dashboard',lRo:'Dashboard',roles:'*'},
   {k:'onboarding',i:'🚀',l:'Onboarding',lRo:'Onboarding',roles:'*'},
   {k:'alerts',i:'🔔',l:'Operational Alerts',lRo:'Alerte operaționale',roles:['master','ops','fin_ops','fin_admin','inventory','contracts_admin','sales','community','senior_trainer'],badge:'6'},
   {k:'team',i:'👥',l:'Team & Org',lRo:'Echipă & Org',roles:['master','ops','fin_ops','fin_admin','community','sales','contracts_admin','inventory','senior_trainer','trainer']},
 ]},
 {grp:'Clients & Contracts',grpRo:'Clienți & Contracte',items:[
   {k:'clients',i:'🏫',l:'Clients',lRo:'Clienți',roles:['master','sales','contracts_admin','fin_ops','fin_admin','ops']},
   {k:'contracts',i:'📄',l:'Contracts',lRo:'Contracte',roles:['master','contracts_admin','fin_ops','fin_admin','ops']},
 ]},
 {grp:'Operational',grpRo:'Operațional',items:[
   {k:'groups',i:'🧪',l:'Groups & Enrollment',lRo:'Grupe & Înscrieri',roles:['master','ops','fin_ops','fin_admin','trainer','senior_trainer']},
   {k:'schedule',i:'📅',l:'Scheduling & Allocation',lRo:'Planificare & Alocări',roles:['master','ops','fin_admin']},
   {k:'attendance',i:'✅',l:'Attendance',lRo:'Prezență',roles:['master','ops','fin_ops','fin_admin','trainer','senior_trainer']},
   {k:'delivered',i:'⚗️',l:'Delivered Experiments',lRo:'Experimente livrate',roles:['master','ops','trainer','senior_trainer']},
 ]},
 {grp:'People & Academy',grpRo:'Oameni & Academie',items:[
   {k:'trainers',i:'🧑‍🔬',l:'Trainers',lRo:'Traineri',roles:['master','ops','fin_ops','community']},
   {k:'recruit',i:'🎯',l:'Recruitment',lRo:'Recrutare',roles:['master','ops','community'],badge:'3'},
   {k:'academy',i:'🎓',l:'WLab Academy',lRo:'WLab Academy',roles:['master','ops','community','trainer','senior_trainer']},
   {k:'evals',i:'⭐',l:'In-Class Evaluations',lRo:'Evaluări în clasă',roles:['master','evaluator'],lock:true},
 ]},
 {grp:'Curriculum',grpRo:'Curriculum',items:[
   {k:'plans',i:'📚',l:'Lesson Plans',lRo:'Planuri de lecție',roles:['master','ops','trainer','senior_trainer'],badge:'300+'},
   {k:'presentations',i:'📊',l:'Presentation Library',lRo:'Biblioteca prezentări',roles:['master','ops','trainer','senior_trainer','community']},
   {k:'media',i:'🎬',l:'Media',lRo:'Media',roles:['master','ops','community']},
 ]},
 {grp:'Inventory',grpRo:'Inventar',items:[
   {k:'inv_reuse',i:'🔁',l:'Reusables · Custody',lRo:'Refolosibile · Custodie',roles:['master','ops','inventory','fin_admin','trainer','senior_trainer']},
   {k:'inv_reag',i:'⚠️',l:'Controlled Reagents',lRo:'Reactivi controlați',roles:['master','ops','inventory','fin_admin']},
   {k:'inv_cons',i:'🧴',l:'Generic Consumables',lRo:'Consumabile generice',roles:['master','ops','inventory','fin_admin']},
   {k:'procure',i:'🛒',l:'Orders (V1: view-only)',lRo:'Comenzi (V1: vizibilitate)',roles:['master','ops','inventory','fin_admin','procurement']},
 ]},
 {grp:'Financial',grpRo:'Financiar',items:[
   {k:'billing',i:'🧾',l:'Billing Code Generator',lRo:'Generator cod facturare',roles:['master','fin_ops','fin_admin','ops']},
   {k:'invoices',i:'🗂️',l:'Invoices & Data',lRo:'Facturi & date',roles:['master','fin_ops','fin_admin']},
   {k:'pay',i:'💸',l:'Trainer Pay',lRo:'Plată traineri',roles:['master','fin_ops','fin_admin','trainer','senior_trainer']},
   {k:'admin_costs',i:'🧮',l:'Admin Costs',lRo:'Costuri Admin',roles:['master','fin_ops','fin_admin'],badge:'NEW'},
   {k:'ceo',i:'📈',l:'CEO Dashboard',lRo:'Dashboard CEO',roles:['master','fin_admin']},
   {k:'balance',i:'📊',l:'Balance Import',lRo:'Import balanță',roles:['master','fin_admin']},
 ]},
 {grp:'Admin',grpRo:'Administrare',items:[
   {k:'users',i:'🔐',l:'Users & Roles',lRo:'Utilizatori & Roluri',roles:['master','platform_owner']},
   {k:'audit',i:'📜',l:'Audit Log',lRo:'Jurnal audit',roles:['master','platform_owner']},
   {k:'settings',i:'⚙️',l:'Organization Settings',lRo:'Setări organizație',roles:['master','platform_owner']},
 ]},
 {grp:'Portal',grpRo:'Portal',items:[
   {k:'cand',i:'🚪',l:'Candidate Portal',lRo:'Portal candidat',roles:['candidate']},
   {k:'platform',i:'🛡️',l:'Cross-org & Franchise',lRo:'Cross-org & franciză',roles:['platform_owner']},
 ]},

function canSee(it){
  if(role==='candidate') return it.k==='cand'||it.k==='dashboard'||(it.k==='onboarding'&&candidateAccepted);
  if(role==='master'||role==='platform_owner'){ if(it.k==='cand') return false; if(it.k==='platform') return role==='platform_owner'; return true; }
  return it.roles==='*'||it.roles.includes(role);
}

let currentScreen='dashboard';
function renderNav(){
  let h='';
  NAV.forEach(g=>{
    const vis=g.items.filter(canSee);
    if(!vis.length) return;
    h+=`<div class="nav-section"><div class="nav-label">${tt(g.grp,g.grpRo)}</div>`;
    vis.forEach(it=>{
      const active=it.k===currentScreen?' active':'';
      const badge=it.badge?`<span class="nav-badge">${it.badge}</span>`:'';
      const lock=it.lock?`<span class="nav-lock">🔒</span>`:'';
      h+=`<button class="nav-item${active}" onclick="go('${it.k}','${g.grp}','${g.grpRo}','${it.l}','${it.lRo}')"><span class="nav-icon">${it.i}</span>${tt(it.l,it.lRo)}${lock}${badge}</button>`;
    });
    h+='</div>';
  });
  document.getElementById('navRoot').innerHTML=h;
}
function go(k,grp,grpRo,l,lRo){ currentScreen=k; document.getElementById('crumb').textContent=tt(grp,grpRo)+' / '+tt(l,lRo); renderNav(); renderScreen(); window.scrollTo(0,0); }

function setRole(r){
  role=r; currentScreen='dashboard';
  document.getElementById('crumb').textContent=tt('Home','Acasă')+' / Dashboard';
  refreshChrome();
  renderNav(); renderScreen(); window.scrollTo(0,0);
}

function renderQuiz(){ const w=document.getElementById('quizWrap'); if(!w)return; w.innerHTML=ACAD_Q.map((q,i)=>`<div class="quiz-card" id="qc${i}"><div class="quiz-q">${i+1}. ${q.q}</div>${q.o.map((o,j)=>`<div class="quiz-opt" id="qo${i}-${j}" onclick="pick(${i},${j})">${o[0]}</div>`).join('')}</div>`).join(''); }
function pick(i,j){ ACAD_Q[i].sel=j; for(let k=0;k<ACAD_Q[i].o.length;k++)document.getElementById(`qo${i}-${k}`).classList.toggle('selected',k===j); }
function submitQuiz(){ let s=0; ACAD_Q.forEach((q,i)=>{ for(let j=0;j<q.o.length;j++){const el=document.getElementById(`qo${i}-${j}`); if(j===q.a)el.classList.add('correct'); else if(q.sel===j)el.classList.add('wrong');} if(q.sel===q.a)s++; }); const r=document.getElementById('quizRes'); const pass=s>=3; r.style.display='block'; r.style.background=pass?'var(--teal-soft)':'var(--amber-soft)'; r.style.color=pass?'#0A5647':'#7A5210'; r.innerHTML=pass?tt(`✅ Certification obtained! Score ${s}/4 — the "Physics L2" track is now green.`,`✅ Certificat obținut! Scor ${s}/4 — traseul „Fizică N2" e acum verde.`):tt(`📚 Score ${s}/4 — review the material and try again.`,`📚 Scor ${s}/4 — reia materialul și încearcă din nou.`); document.getElementById('quizAct').style.display='none'; }

function calcBilling(){
  const tip=document.getElementById('b_tip').value;
  const copii=+document.getElementById('b_copii').value||0;
  const ore=document.getElementById('b_ore').value;
  const traineri=+document.getElementById('b_train').value||0;
  const tarif=+document.getElementById('b_tarif').value||0;
  const remote=document.getElementById('b_remote').checked;
  const lang=document.getElementById('b_lang').checked;
  const isSA=TIPS[tip].isSA; const d=parseFloat(ore);
  let mult=1; if(d===1.5)mult=1.2; else if(d===2)mult=isSA?2:1.5; else if(d>2)mult=d;
  let per=tarif*mult; if(remote)per*=1.25; if(lang)per*=1.20;
  const totalT=per*traineri;
  const oreTr=Math.round(d*(isSA&&d===2?2:1)*traineri*10)/10;
  const mat=Math.round(copii/12*30);
  const oreStr=(''+ore).replace('.',',');
  const code=`${tip}-${copii}-${oreStr}-${(''+oreTr).replace('.',',')}`;
  document.getElementById('b_code').textContent=code;
  document.getElementById('b_exp').textContent=`${tt(TIPS[tip].l,TIPS[tip].lRo)} · ${copii} ${tt('children','copii')} · ${oreStr} ${tt('workshop hours','ore atelier')} · ${(''+oreTr).replace('.',',')} ${tt('trainer hours','ore trainer')}`;
  document.getElementById('b_pt').textContent=per.toFixed(2)+' lei';
  document.getElementById('b_tt').textContent=totalT.toFixed(2)+' lei';
  document.getElementById('b_mat').textContent=mat+' lei';
  document.getElementById('b_tot').textContent=(totalT+mat).toFixed(2)+' lei';
}

function lineChart(){
  const fc=[30,34,38,40,44,50,52,55,58,60,63,66], ac=[28,33,36,41,42,47,0,0,0,0,0,0];
  const W=340,H=140,max=70,pad=6;
  const X=i=>pad+i*((W-2*pad)/11), Y=v=>H-pad-(v/max)*(H-2*pad);
  const line=(arr,col,dash)=>{const pts=arr.map((v,i)=>v?`${X(i)},${Y(v)}`:null).filter(Boolean).join(' ');return `<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2.5" ${dash?'stroke-dasharray="4 4"':''} stroke-linecap="round"/>`;};
  const dots=ac.map((v,i)=>v?`<circle cx="${X(i)}" cy="${Y(v)}" r="3" fill="#EC008C"/>`:'').join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${line(fc,'#C7BEC5',true)}${line(ac.filter(v=>v),'#EC008C',false)}${dots}</svg>`;
}
